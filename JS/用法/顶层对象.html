</body>
<script>

    let obj1 = {
        name: '张三',
        age: 18,
    }
    var obj2 = {
        name: '李四',
        age: 20,
    }

    console.log(obj1)
    console.log(window.obj1) // 无值

    console.log(obj2)
    console.log(window.obj2) // 有值

</script>
