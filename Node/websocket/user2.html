<!DOCTYPE html>
<html lang="zh">
    <head>
    <title>用户2</title>
  </head>
<body>
  <input id="msg" placeholder="输入消息" />
  <button onclick="send()">发送</button>

  <script>
    const ws = new WebSocket('ws://localhost:7000');

    ws.onopen = () => {
      
    };

    ws.onmessage = (event) => {
      console.log(event.data);
    };

    function send() {
      const input = document.getElementById('msg');
      ws.send(input.value);
      input.value = '';
    }
  </script>
</body>
</html>
